<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despliegue - Amplify</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            border-top: 5px solid #ff9900; /* Color característico de AWS */
        }
        h1 {
            color: #333333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        p {
            color: #555555;
            font-size: 18px;
            margin: 10px 0;
        }
        .highlight {
            font-weight: bold;
            color: #d97706;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Despliegue de Prueba - Amplify</h1>
        <p><strong>Nombre:</strong> <span class="highlight">Sofia Portela</span></p>
        <p><strong>N° de Estudiante:</strong> <span class="highlight">347599</span></p>
        <p><strong>Plataforma:</strong> <span class="highlight">AWS Amplify</span></p>
    </div>
</body>
</html>
